# Per-node dependencies for the 1.20.1 Forge node.
mod_loader=forge
java_version=17
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.23
loader_version_range=[47,)
pack_format=15

# TC4R: the 20740 forge release jar is SRG-mapped; ModDevGradle's mod* configurations remap it
# to official names for both compile and runtime. The full jar is the compile classpath because
# the port reaches into TC4R internals (jars, smelters, essentia transport), not just the api.
tc4r_version=0.1.0-20740
thaumcraft_version_range=[4.2.3.5-1.20.1-port.0.1.0-20740,)

# GeckoLib drives the BlueWolf / Chester entity animations (replaces 1.12 HammerAnimations).
geckolib_version=4.8.4

# TC4R declares both mandatory.
curios_version=5.14.1+1.20.1
terrablender_version=1.20.1-3.0.1.10
