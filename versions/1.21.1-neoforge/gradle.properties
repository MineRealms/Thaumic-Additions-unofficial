# Per-node dependencies for the 1.21.1 NeoForge node.
mod_loader=neoforge
java_version=21
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
loader_version_range=[4,)
pack_format=34

# TC4R: the NeoForge release jar is already in official mappings, so it doubles as the compile
# classpath. The dev kit also ships -api/-sources classifiers for IDE use.
tc4r_version=0.1.0-20748
thaumcraft_version_range=[4.2.3.5-1.21.1-port.0.1.0-20748,)

# GeckoLib drives the BlueWolf / Chester entity animations (replaces 1.12 HammerAnimations).
geckolib_version=4.9.3

# TC4R declares both mandatory. TerraBlender is pinned by Modrinth version id (4.1.0.8 also
# exists for other loaders).
curios_version=9.5.1+1.21.1
terrablender_file=6e8GCrLb

# JEI: compile-only, so the plugin can be written but the mod runs without it.
# Pinned by KubeJS, which refuses to load against anything older: 2101.7.377 wants 19.25.0.322 or
# above, and the 19.21 that satisfied nothing else here aborted the whole client at mod loading.
jei_version=19.57.0.451
